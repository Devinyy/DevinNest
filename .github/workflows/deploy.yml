name: Deploy to production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: devinnest-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        run: node --test tests/*.mjs

      - name: Build static site
        run: npm run build
        env:
          ASTRO_SITE: https://devinnest.top

      - name: Create release archive
        run: tar -czf devinnest-release.tar.gz dist Dockerfile docker-compose.yml nginx.conf scripts/activate-release.sh

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: devinnest-release
          path: devinnest-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TMP_DIR: /tmp/devinnest-release-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_ARCHIVE: /tmp/devinnest-release-${{ github.run_id }}-${{ github.run_attempt }}/devinnest-release.tar.gz

    steps:
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: devinnest-release

      - name: Validate deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" || { echo "Missing SERVER_HOST" >&2; exit 1; }
          test -n "$SERVER_USER" || { echo "Missing SERVER_USER" >&2; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo "Missing SERVER_SSH_KEY" >&2; exit 1; }
          case "$SERVER_HOST_FINGERPRINT" in
            SHA256:*) ;;
            *) echo "SERVER_HOST_FINGERPRINT must use the SHA256:... format" >&2; exit 1 ;;
          esac

      - name: Prepare unique release directory
        uses: appleboy/ssh-action@v1.2.3
        env:
          RELEASE_TMP_DIR: ${{ env.RELEASE_TMP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          envs: RELEASE_TMP_DIR
          script_stop: true
          script: |
            set -euo pipefail
            case "$RELEASE_TMP_DIR" in
              /tmp/devinnest-release-[0-9]*-[0-9]*) ;;
              *) echo "Unexpected release temporary directory" >&2; exit 1 ;;
            esac
            mkdir -p -- "$RELEASE_TMP_DIR"
            chmod 700 -- "$RELEASE_TMP_DIR"

      - name: Upload release to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          source: devinnest-release.tar.gz
          target: ${{ env.RELEASE_TMP_DIR }}/
          overwrite: true

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.3
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR || '/opt/homepage' }}
          ARCHIVE: ${{ env.RELEASE_ARCHIVE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          envs: RELEASE_ID,PROJECT_DIR,ARCHIVE
          script_stop: true
          script: |
            set -euo pipefail
            SCRIPT_TMP="$(mktemp /tmp/devinnest-activate.XXXXXX.sh)"
            trap 'rm -f "$SCRIPT_TMP"' EXIT
            tar -xOzf "$ARCHIVE" scripts/activate-release.sh > "$SCRIPT_TMP"
            chmod 700 "$SCRIPT_TMP"
            RELEASE_ID="$RELEASE_ID" PROJECT_DIR="$PROJECT_DIR" ARCHIVE="$ARCHIVE" \
              bash "$SCRIPT_TMP"
